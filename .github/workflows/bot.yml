name: Run Stealth Bot (WARP VPN)

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 14 * * *' 

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install and Connect Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          
          # Register and start WARP service non-interactively
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver selenium selenium-stealth requests

      - name: Run Bot Script
        env:
          GITHUB_ACTIONS: "true"
        run: python stealth_bot.py

      - name: Upload Debug Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-debug-screenshot
          path: debug_error_visual_flow.png
          if-no-files-found: ignore
