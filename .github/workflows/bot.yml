name: Run Stealth Bot (Windscribe + Buster)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours for fresh IP

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg curl unzip apt-transport-https ca-certificates

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install and Connect Windscribe VPN
        run: |
          # Install Windscribe
          sudo apt-get install -y windscribe-cli || (
            curl -fsSL https://windscribe.com/install/desktop/linux_deb_x64 > /tmp/windscribe.deb
            sudo dpkg -i /tmp/windscribe.deb || sudo apt-get install -f -y
          )
          
          # Login
          windscribe login <<EOF
          ${{ secrets.mandymild }}
          ${{ secrets.irIR12@$ }}
          EOF
          
          # Connect to best location
          windscribe connect best
          sleep 5
          
          # Verify IP changed
          echo "Connected! IP:"
          curl -s https://ipinfo.io/ip

      - name: Download and Setup Buster Extension
        run: |
          # Get latest Buster release URL
          BUSTER_URL=$(curl -s https://api.github.com/repos/dessant/buster/releases/latest | \
            grep "browser_download_url.*chrome-web-store.*\.zip" | cut -d '"' -f 4)
          
          # If not found, try alternative
          if [ -z "$BUSTER_URL" ]; then
            BUSTER_URL="https://github.com/dessant/buster/releases/download/v3.1.0/buster-chrome-3.1.0.zip"
          fi
          
          echo "Downloading Buster from: $BUSTER_URL"
          wget -q "$BUSTER_URL" -O /tmp/buster.zip
          
          # Extract
          sudo mkdir -p /opt/buster
          sudo unzip -q /tmp/buster.zip -d /opt/buster
          
          # List contents
          echo "Buster contents:"
          ls -la /opt/buster/
          
          # Verify manifest exists
          if [ -f "/opt/buster/manifest.json" ]; then
            echo "✓ Buster extension ready"
          else
            echo "! manifest.json not found, checking subdirectories..."
            find /opt/buster -name "manifest.json" | head -1
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver selenium selenium-stealth requests

      - name: Run Bot
        env:
          GITHUB_ACTIONS: "true"
          BUSTER_PATH: "/opt/buster"
        run: |
          echo "Starting bot with Windscribe + Buster..."
          python stealth_bot.py

      - name: Disconnect VPN
        if: always()
        run: windscribe disconnect || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-screenshots
          path: screenshot_*.png
          if-no-files-found: ignore

      - name: Upload Credentials
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-credentials
          path: account_credentials.txt
          if-no-files-found: ignore
