name: Run Stealth Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable

      - name: Setup Webshare Proxy
        run: |
          echo "Configuring proxy..."
          # Add your Webshare proxy here or use GitHub Secret
          # Format: ip:port:username:password for authenticated proxies
          # Or ip:port for open proxies

      - name: Download Buster Extension
        run: |
          echo "Downloading Buster..."
          LATEST_URL=$(curl -s https://api.github.com/repos/dessant/buster/releases/latest | grep "browser_download_url.*chrome.*zip" | head -1 | cut -d '"' -f 4)
          
          if [ -z "$LATEST_URL" ]; then
            LATEST_URL="https://github.com/dessant/buster/releases/download/v3.1.0/buster-chrome-3.1.0.zip"
          fi
          
          wget --tries=3 --timeout=30 -q "$LATEST_URL" -O /tmp/buster.zip || \
          wget --tries=3 --timeout=30 -q "https://github.com/dessant/buster/releases/download/v3.1.0/buster-chrome-3.1.0.zip" -O /tmp/buster.zip
          
          if [ -f "/tmp/buster.zip" ]; then
            sudo mkdir -p /opt/buster
            sudo unzip -q -o /tmp/buster.zip -d /opt/buster
            ls -la /opt/buster/
          else
            mkdir -p /opt/buster
          fi

      - name: Install Python Dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q undetected-chromedriver selenium selenium-stealth requests

      - name: Run Bot
        env:
          GITHUB_ACTIONS: "true"
          BUSTER_PATH: "/opt/buster"
          PYTHONUNBUFFERED: "1"
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python stealth_bot.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-results
          path: |
            screenshot_*.png
            account_credentials.txt
          if-no-files-found: ignore
