name: Run Stealth Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome & Xvfb
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable xvfb xserver-xephyr

      - name: Download NopeCHA Extension
        run: |
          echo "Downloading NopeCHA extension..."
          sudo mkdir -p /opt/nopecha
          
          # 1. Try downloading latest NopeCHA release ZIP from GitHub tags
          LATEST_TAG=$(curl -s https://api.github.com/repos/NopeCHAMP/nopecha-extension/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -n "$LATEST_TAG" ]; then
            wget --tries=3 --timeout=30 -q "https://github.com/NopeCHAMP/nopecha-extension/archive/refs/tags/${LATEST_TAG}.zip" -O /tmp/nopecha.zip || true
          fi
          
          # 2. Fallback: Download default main branch archive if release tag ZIP failed
          if [ ! -s "/tmp/nopecha.zip" ]; then
            wget --tries=3 --timeout=30 -q "https://github.com/NopeCHAMP/nopecha-extension/archive/refs/heads/main.zip" -O /tmp/nopecha.zip || true
          fi
          
          # 3. Unpack extension cleanly into /opt/nopecha
          if [ -s "/tmp/nopecha.zip" ]; then
            sudo unzip -q -o /tmp/nopecha.zip -d /tmp/nopecha_unpacked
            # Move inner directory contents directly into /opt/nopecha
            sudo cp -r /tmp/nopecha_unpacked/*/* /opt/nopecha/ 2>/dev/null || sudo cp -r /tmp/nopecha_unpacked/* /opt/nopecha/
            ls -la /opt/nopecha/
          else
            echo "Warning: Could not download NopeCHA ZIP. Running without extension."
          fi

      - name: Install Python Dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q undetected-chromedriver selenium selenium-stealth requests pyvirtualdisplay

      - name: Run Bot with Virtual Display
        env:
          GITHUB_ACTIONS: "true"
          NOPECHA_PATH: "/opt/nopecha"
          PYTHONUNBUFFERED: "1"
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python stealth_bot.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-results
          path: |
            screenshot_*.png
            account_credentials.txt
          if-no-files-found: ignore
