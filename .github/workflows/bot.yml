name: Run Stealth Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome & Xvfb
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable xvfb xserver-xephyr

      - name: Download NopeCHA Extension (Reliable Multi-Source)
        run: |
          echo "Downloading NopeCHA extension..."
          sudo mkdir -p /opt/nopecha
          
          # 1. Try downloading from the official NopeCHALLC repo archive
          wget --tries=3 --timeout=25 -q "https://github.com/NopeCHALLC/nopecha-extension/archive/refs/heads/main.zip" -O /tmp/nopecha.zip || true
          
          # 2. Fallback to official v0.4.8 release tag archive from NopeCHALLC
          if [ ! -s "/tmp/nopecha.zip" ]; then
            wget --tries=3 --timeout=25 -q "https://github.com/NopeCHALLC/nopecha-extension/archive/refs/tags/0.4.8.zip" -O /tmp/nopecha.zip || true
          fi

          # 3. Final Fallback: Download CRX directly from Google Chrome Web Store
          if [ ! -s "/tmp/nopecha.zip" ]; then
            echo "Fetching from Chrome Web Store..."
            wget --tries=3 --timeout=25 -q "https://github.com/clients2.google.com/service/update2/crx?response=redirect&prodversion=130.0&acceptformat=crx2,crx3&x=id%3Ddknlfmjaanfblgfdfebhijalfmhmjjjo%26uc" -O /tmp/nopecha.zip || true
          fi
          
          # Unpack cleanly into /opt/nopecha
          if [ -s "/tmp/nopecha.zip" ]; then
            sudo unzip -q -o /tmp/nopecha.zip -d /tmp/nopecha_unpacked || true
            # Copy all extracted extension files directly into /opt/nopecha
            sudo cp -r /tmp/nopecha_unpacked/*/* /opt/nopecha/ 2>/dev/null || sudo cp -r /tmp/nopecha_unpacked/* /opt/nopecha/
            ls -la /opt/nopecha/
          else
            echo "Warning: All download mirrors failed. Running browser without NopeCHA."
          fi

      - name: Install Python Dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q undetected-chromedriver selenium selenium-stealth requests pyvirtualdisplay

      - name: Run Bot with Virtual Display
        env:
          GITHUB_ACTIONS: "true"
          NOPECHA_PATH: "/opt/nopecha"
          PYTHONUNBUFFERED: "1"
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python stealth_bot.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-results
          path: |
            screenshot_*.png
            account_credentials.txt
          if-no-files-found: ignore
