name: Run Stealth Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome & Xvfb
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable xvfb xserver-xephyr

      - name: Download NopeCHA Extension
        run: |
          echo "Downloading NopeCHA..."
          # Download official NopeCHA Chrome extension ZIP
          wget --tries=3 --timeout=30 -q "https://github.com/NopeCHAMP/nopecha-extension/releases/latest/download/nopecha-chrome.zip" -O /tmp/nopecha.zip || \
          wget --tries=3 --timeout=30 -q "https://github.com/NopeCHAMP/nopecha-extension/releases/download/0.4.8/nopecha-chrome.zip" -O /tmp/nopecha.zip
          
          if [ -f "/tmp/nopecha.zip" ]; then
            sudo mkdir -p /opt/nopecha
            sudo unzip -q -o /tmp/nopecha.zip -d /opt/nopecha
            ls -la /opt/nopecha/
          else
            mkdir -p /opt/nopecha
          fi

      - name: Install Python Dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q undetected-chromedriver selenium selenium-stealth requests pyvirtualdisplay

      - name: Run Bot with Virtual Display
        env:
          GITHUB_ACTIONS: "true"
          NOPECHA_PATH: "/opt/nopecha"
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}  # <-- Add this secret in GitHub Repo Settings!
          PYTHONUNBUFFERED: "1"
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python stealth_bot.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-results
          path: |
            screenshot_*.png
            account_credentials.txt
          if-no-files-found: ignore
