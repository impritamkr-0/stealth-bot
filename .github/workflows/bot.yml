name: Run Stealth Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# Add timeout to prevent hanging
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Force kill after 10 minutes
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        timeout-minutes: 2
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable
          google-chrome --version

      - name: Setup VPN (ProtonVPN - More Reliable)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          # Try ProtonVPN (more reliable CLI than Windscribe)
          wget -q https://repo.protonvpn.com/debian/dists/stable/main/binary-all/protonvpn-stable-release_1.0.3_all.deb -O /tmp/proton.deb
          sudo dpkg -i /tmp/proton.deb || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq protonvpn-cli || echo "VPN install failed, continuing without"

      - name: Download Buster
        timeout-minutes: 2
        run: |
          # Direct download with fallback
          wget -q "https://github.com/dessant/buster/releases/download/v3.1.0/buster-chrome-3.1.0.zip" -O /tmp/buster.zip || \
          wget -q "https://github.com/dessant/buster/releases/latest/download/buster-chrome.zip" -O /tmp/buster.zip
          
          sudo mkdir -p /opt/buster
          sudo unzip -q -o /tmp/buster.zip -d /opt/buster
          ls -la /opt/buster/

      - name: Install Dependencies
        timeout-minutes: 2
        run: |
          pip install -q --upgrade pip
          pip install -q undetected-chromedriver selenium selenium-stealth requests

      - name: Run Bot
        timeout-minutes: 5  # Bot has max 5 minutes
        env:
          GITHUB_ACTIONS: "true"
          BUSTER_PATH: "/opt/buster"
          PYTHONUNBUFFERED: "1"
        run: python stealth_bot.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-results-${{ github.run_id }}
          path: |
            screenshot_*.png
            account_credentials.txt
          if-no-files-found: ignore
