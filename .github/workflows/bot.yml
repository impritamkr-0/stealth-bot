name: Run Stealth Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome & Xvfb
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable xvfb xserver-xephyr

      - name: Download & Unpack Buster Extension
        run: |
          echo "Downloading Buster extension via Python..."
          sudo mkdir -p /opt/buster
          python3 -c "
          import urllib.request, zipfile, os
          # Buster Extension ID: mpbjkejclgoceaajmgiaoecpdmlomohb
          url = 'https://clients2.google.com/service/update2/crx?response=redirect&prodversion=130.0&acceptformat=crx2,crx3&x=id%3Dmpbjkejclgoceaajmgiaoecpdmlomohb%26uc'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as resp, open('/tmp/buster.zip', 'wb') as f:
                  f.write(resp.read())
              with zipfile.ZipFile('/tmp/buster.zip', 'r') as z:
                  z.extractall('/opt/buster')
              print('Buster downloaded and unpacked successfully!')
          except Exception as e:
              print('Error downloading Buster:', e)
          "
          ls -la /opt/buster/

      - name: Install Python Dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q undetected-chromedriver selenium selenium-stealth requests pyvirtualdisplay

      - name: Run Bot with Virtual Display
        env:
          GITHUB_ACTIONS: "true"
          BUSTER_PATH: "/opt/buster"
          PYTHONUNBUFFERED: "1"
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python stealth_bot.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-results
          path: |
            screenshot_*.png
            account_credentials.txt
          if-no-files-found: ignore
